<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="backGrad" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="86">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="frontGrad" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="110">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="btnGrad" gradientUnits="userSpaceOnUse" x1="0" y1="88" x2="0" y2="99">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cursorGrad" gradientUnits="userSpaceOnUse" x1="64" y1="68" x2="64" y2="92.94">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="backStroke" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="86">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="0.097" stop-color="#A5B4FC" stop-opacity="0.51"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0.51"/>
    </linearGradient>
    <linearGradient id="frontStroke" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="110">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="0.083" stop-color="#3F3F46" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#3F3F46" stop-opacity="0.78"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="68" cy="82" r="32">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tipGlow" gradientUnits="userSpaceOnUse" cx="64" cy="68" r="4.2">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="backClip">
      <rect x="34" y="14" width="78" height="72" rx="14"/>
    </clipPath>
    <clipPath id="frontClip">
      <rect x="16" y="38" width="80" height="72" rx="14"/>
    </clipPath>
    <clipPath id="cursorClip">
      <polygon points="64,68 64,90.62 70.09,85.11 73.57,92.94 77.05,91.49 73.57,83.66 79.95,83.66"/>
    </clipPath>
  </defs>

  <!-- Maps original bbox [15.2,13.2,97.6x97.6] to [0,0,1024x1024] for 0px gap -->
  <g transform="scale(10.491803278688525)">
    <g transform="translate(-15.2, -13.2)">
      <!-- Back window: electric indigo/violet glass -->
      <g>
        <rect x="34" y="14" width="78" height="72" rx="14" fill="url(#backGrad)"/>
        <g clip-path="url(#backClip)">
          <rect x="34" y="14" width="78" height="17" fill="#4F46E5" opacity="0.55"/>
          <rect x="44" y="33" width="52" height="4" rx="2" fill="#E0E7FF" opacity="0.29"/>
          <rect x="44" y="43" width="38" height="4" rx="2" fill="#E0E7FF" opacity="0.22"/>
          <rect x="90" y="53" width="14" height="18" rx="3.5" fill="#38BDF8" opacity="0.67"/>
        </g>
        <!-- Back header dots + pill -->
        <circle cx="44" cy="22.5" r="2.2" fill="#E0E7FF" opacity="0.75"/>
        <circle cx="51.5" cy="22.5" r="2.2" fill="#E0E7FF" opacity="0.75"/>
        <circle cx="59" cy="22.5" r="2.2" fill="#E0E7FF" opacity="0.75"/>
        <rect x="68" y="18" width="36" height="9" rx="4.5" fill="#E0E7FF" opacity="0.2"/>
        <path fill-rule="evenodd" fill="url(#backStroke)" d="M 33.2,28 V 72 A 14.8 14.8 0 0 1 48,86.8 H 98 A 14.8 14.8 0 0 1 112.8,72 V 28 A 14.8 14.8 0 0 1 98,13.2 H 48 A 14.8 14.8 0 0 1 33.2,28 Z M 35.2,28 V 72 A 12.8 12.8 0 0 1 48,84.8 H 98 A 12.8 12.8 0 0 1 110.8,72 V 28 A 12.8 12.8 0 0 1 98,15.2 H 48 A 12.8 12.8 0 0 1 35.2,28 Z"/>
      </g>

      <!-- Front window: obsidian/zinc glass -->
      <g>
        <rect x="16" y="38" width="80" height="72" rx="14" fill="url(#frontGrad)"/>
        <g clip-path="url(#frontClip)">
          <circle cx="68" cy="82" r="32" fill="url(#glow)"/>
          <rect x="16" y="38" width="80" height="20" fill="#101014"/>
          <rect x="16" y="56.8" width="80" height="1.2" fill="#27272A"/>
          <rect x="25" y="65" width="35" height="4" rx="2" fill="#71717A" opacity="0.63"/>
          <rect x="25" y="75" width="23" height="4" rx="2" fill="#52525B" opacity="0.55"/>
        </g>
        <!-- Traffic dots -->
        <circle cx="25" cy="48" r="2.2" fill="#F43F5E"/>
        <circle cx="31.5" cy="48" r="2.2" fill="#F59E0B"/>
        <circle cx="38" cy="48" r="2.2" fill="#10B981"/>
        <!-- URL / command pill -->
        <rect x="45" y="42.5" width="43" height="11" rx="4.5" fill="#1E1E24" stroke="#2D2D37" stroke-opacity="0.8" stroke-width="1"/>
        <circle cx="51" cy="48" r="1.4" fill="#38BDF8" opacity="0.86"/>
        <rect x="56" y="46.5" width="24" height="3" rx="1.2" fill="#71717A" opacity="0.71"/>
        <!-- Automation button -->
        <rect x="25" y="88" width="31" height="11" rx="4.5" fill="url(#btnGrad)" stroke="#60A5FA" stroke-opacity="0.7" stroke-width="1"/>
        <path d="M 33 91 L 37 93.5 L 33 96" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.94"/>
        <path d="M 41 95.5 H 46" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
        <path fill-rule="evenodd" fill="url(#frontStroke)" d="M 15.2,52 V 96 A 14.8 14.8 0 0 1 30,110.8 H 82 A 14.8 14.8 0 0 1 96.8,96 V 52 A 14.8 14.8 0 0 1 82,37.2 H 30 A 14.8 14.8 0 0 1 15.2,52 Z M 17.2,52 V 96 A 12.8 12.8 0 0 1 30,108.8 H 82 A 12.8 12.8 0 0 1 94.8,96 V 52 A 12.8 12.8 0 0 1 82,39.2 H 30 A 12.8 12.8 0 0 1 17.2,52 Z"/>
      </g>

      <!-- Hero cursor: white rim silhouette, gradient fill -->
      <polygon
        points="64,68 64,90.62 70.09,85.11 73.57,92.94 77.05,91.49 73.57,83.66 79.95,83.66"
        fill="#FFFFFF"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linejoin="round"/>
      <polygon
        points="64,68 64,90.62 70.09,85.11 73.57,92.94 77.05,91.49 73.57,83.66 79.95,83.66"
        fill="url(#cursorGrad)"/>
      <g clip-path="url(#cursorClip)">
        <circle cx="64" cy="68" r="4.2" fill="url(#tipGlow)"/>
      </g>
    </g>
  </g>
</svg>
