<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="backGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="backStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#A5B4FC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="frontStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.2" stop-color="#71717A" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3F3F46" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tipGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="backClip">
      <rect x="34" y="14" width="78" height="72" rx="14"/>
    </clipPath>
    <clipPath id="frontClip">
      <rect x="16" y="38" width="80" height="72" rx="14"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="cursorShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.8" dy="3" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Back window: electric indigo/violet glass -->
  <g filter="url(#softShadow)">
    <rect x="34" y="14" width="78" height="72" rx="14" fill="url(#backGrad)"/>
    <g clip-path="url(#backClip)">
      <rect x="34" y="14" width="78" height="17" fill="#4F46E5" opacity="0.55"/>
      <rect x="44" y="33" width="52" height="4" rx="2" fill="#E0E7FF" opacity="0.3"/>
      <rect x="44" y="43" width="38" height="4" rx="2" fill="#E0E7FF" opacity="0.22"/>
      <rect x="90" y="53" width="14" height="18" rx="3.5" fill="#38BDF8" opacity="0.67"/>
    </g>
    <!-- Back header dots + pill -->
    <circle cx="44" cy="22.5" r="2.2" fill="#E0E7FF" opacity="0.75"/>
    <circle cx="51.5" cy="22.5" r="2.2" fill="#E0E7FF" opacity="0.75"/>
    <circle cx="59" cy="22.5" r="2.2" fill="#E0E7FF" opacity="0.75"/>
    <rect x="68" y="18" width="36" height="9" rx="4.5" fill="#E0E7FF" opacity="0.2"/>
    <rect x="34" y="14" width="78" height="72" rx="14" fill="none" stroke="url(#backStroke)" stroke-width="1.5"/>
  </g>

  <!-- Front window: obsidian/zinc glass -->
  <g filter="url(#softShadow)">
    <rect x="16" y="38" width="80" height="72" rx="14" fill="url(#frontGrad)"/>
    <g clip-path="url(#frontClip)">
      <ellipse cx="68" cy="82" rx="32" ry="32" fill="url(#glow)"/>
      <rect x="16" y="38" width="80" height="20" fill="#101014"/>
      <rect x="16" y="56.8" width="80" height="1.2" fill="#27272A"/>
      <rect x="25" y="65" width="35" height="4" rx="2" fill="#71717A" opacity="0.63"/>
      <rect x="25" y="75" width="23" height="4" rx="2" fill="#52525B" opacity="0.55"/>
    </g>
    <!-- Traffic dots -->
    <circle cx="25" cy="48" r="2.2" fill="#F43F5E"/>
    <circle cx="31.5" cy="48" r="2.2" fill="#F59E0B"/>
    <circle cx="38" cy="48" r="2.2" fill="#10B981"/>
    <!-- URL / command pill -->
    <rect x="45" y="42.5" width="43" height="11" rx="5" fill="#1E1E24" stroke="#2D2D37" stroke-width="1"/>
    <circle cx="51" cy="48" r="1.4" fill="#38BDF8" opacity="0.86"/>
    <rect x="56" y="46.5" width="24" height="3" rx="1.5" fill="#71717A" opacity="0.7"/>
    <!-- Automation button -->
    <rect x="25" y="88" width="31" height="11" rx="5" fill="url(#btnGrad)" stroke="#60A5FA" stroke-opacity="0.7" stroke-width="1"/>
    <path d="M 33 91 L 37 93.5 L 33 96" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.94"/>
    <path d="M 41 95.5 H 46" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <rect x="16" y="38" width="80" height="72" rx="14" fill="none" stroke="url(#frontStroke)" stroke-width="1.5"/>
  </g>

  <!-- Hero cursor -->
  <g filter="url(#cursorShadow)">
    <polygon
      points="64,68 64,90.62 70.09,85.11 73.57,92.94 77.05,91.49 73.57,83.66 79.95,83.66"
      fill="url(#cursorGrad)"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
      paint-order="stroke"/>
    <circle cx="64" cy="68" r="4.2" fill="url(#tipGlow)"/>
  </g>
</svg>
