<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="backGrad" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="688">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="frontGrad" gradientUnits="userSpaceOnUse" x1="0" y1="304" x2="0" y2="880">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="btnGrad" gradientUnits="userSpaceOnUse" x1="0" y1="704" x2="0" y2="792">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cursorGrad" gradientUnits="userSpaceOnUse" x1="512" y1="544" x2="512" y2="743.52">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="backStroke" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="688">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="0.097" stop-color="#A5B4FC" stop-opacity="0.51"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0.51"/>
    </linearGradient>
    <linearGradient id="frontStroke" gradientUnits="userSpaceOnUse" x1="0" y1="304" x2="0" y2="880">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="0.083" stop-color="#3F3F46" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#3F3F46" stop-opacity="0.78"/>
