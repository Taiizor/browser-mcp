    <radialGradient id="tipGlow" gradientUnits="userSpaceOnUse" cx="512" cy="544" r="33.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="backClip">
