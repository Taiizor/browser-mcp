    </clipPath>
  </defs>

  <!-- Fit 780.8x780.8 artwork edge-to-edge into the 1024 frame: scale 80/61, offset to (0,0) -->
  <g transform="translate(-159.47541,-138.4918) scale(1.31147541)">
  <!-- Back window: electric indigo/violet glass -->
  <g>
    <rect x="272" y="112" width="624" height="576" rx="112" fill="url(#backGrad)"/>
    <g clip-path="url(#backClip)">
      <rect x="272" y="112" width="624" height="136" fill="#4F46E5" opacity="0.55"/>
      <rect x="352" y="264" width="416" height="32" rx="16" fill="#E0E7FF" opacity="0.29"/>
      <rect x="352" y="344" width="304" height="32" rx="16" fill="#E0E7FF" opacity="0.22"/>
      <rect x="720" y="424" width="112" height="144" rx="28" fill="#38BDF8" opacity="0.67"/>
    </g>
    <!-- Back header dots + pill -->
    <circle cx="352" cy="180" r="17.6" fill="#E0E7FF" opacity="0.75"/>
    <circle cx="412" cy="180" r="17.6" fill="#E0E7FF" opacity="0.75"/>
    <circle cx="472" cy="180" r="17.6" fill="#E0E7FF" opacity="0.75"/>
    <rect x="544" y="144" width="288" height="72" rx="36" fill="#E0E7FF" opacity="0.2"/>
    <path fill-rule="evenodd" fill="url(#backStroke)" d="M 265.6 224 V 576 A 118.4 118.4 0 0 0 384 694.4 H 784 A 118.4 118.4 0 0 0 902.4 576 V 224 A 118.4 118.4 0 0 0 784 105.6 H 384 A 118.4 118.4 0 0 0 265.6 224 Z M 281.6 224 V 576 A 102.4 102.4 0 0 0 384 678.4 H 784 A 102.4 102.4 0 0 0 886.4 576 V 224 A 102.4 102.4 0 0 0 784 121.6 H 384 A 102.4 102.4 0 0 0 281.6 224 Z"/>
  </g>

  <!-- Front window: obsidian/zinc glass -->
  <g>
    <rect x="128" y="304" width="640" height="576" rx="112" fill="url(#frontGrad)"/>
    <g clip-path="url(#frontClip)">
      <circle cx="544" cy="656" r="256" fill="url(#glow)"/>
      <rect x="128" y="304" width="640" height="160" fill="#101014"/>
      <rect x="128" y="454.4" width="640" height="9.6" fill="#27272A"/>
      <rect x="200" y="520" width="280" height="32" rx="16" fill="#71717A" opacity="0.63"/>
      <rect x="200" y="600" width="184" height="32" rx="16" fill="#52525B" opacity="0.55"/>
    </g>
    <!-- Traffic dots -->
    <circle cx="200" cy="384" r="17.6" fill="#F43F5E"/>
    <circle cx="252" cy="384" r="17.6" fill="#F59E0B"/>
    <circle cx="304" cy="384" r="17.6" fill="#10B981"/>
    <!-- URL / command pill -->
    <rect x="360" y="340" width="344" height="88" rx="36" fill="#1E1E24" stroke="#2D2D37" stroke-opacity="0.8" stroke-width="8"/>
    <circle cx="408" cy="384" r="11.2" fill="#38BDF8" opacity="0.86"/>
    <rect x="448" y="372" width="192" height="24" rx="9.6" fill="#71717A" opacity="0.71"/>
    <!-- Automation button -->
    <rect x="200" y="704" width="248" height="88" rx="36" fill="url(#btnGrad)" stroke="#60A5FA" stroke-opacity="0.7" stroke-width="8"/>
    <path d="M 264 728 L 296 748 L 264 768" fill="none" stroke="#FFFFFF" stroke-width="17.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.94"/>
    <path d="M 328 764 H 368" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.78"/>
    <path fill-rule="evenodd" fill="url(#frontStroke)" d="M 121.6 416 V 768 A 118.4 118.4 0 0 0 240 886.4 H 656 A 118.4 118.4 0 0 0 774.4 768 V 416 A 118.4 118.4 0 0 0 656 297.6 H 240 A 118.4 118.4 0 0 0 121.6 416 Z M 137.6 416 V 768 A 102.4 102.4 0 0 0 240 870.4 H 656 A 102.4 102.4 0 0 0 758.4 768 V 416 A 102.4 102.4 0 0 0 656 313.6 H 240 A 102.4 102.4 0 0 0 137.6 416 Z"/>
  </g>

  <!-- Hero cursor: white rim silhouette, gradient fill -->
  <polygon
    points="512,544 512,724.96 560.72,680.88 588.56,743.52 616.4,731.92 588.56,669.28 639.6,669.28"
    fill="#FFFFFF"
    stroke="#FFFFFF"
    stroke-width="24"
    stroke-linejoin="round"/>
  <polygon
    points="512,544 512,724.96 560.72,680.88 588.56,743.52 616.4,731.92 588.56,669.28 639.6,669.28"
    fill="url(#cursorGrad)"/>
  <g clip-path="url(#cursorClip)">
    <circle cx="512" cy="544" r="33.6" fill="url(#tipGlow)"/>
  </g>
  </g>
