name: CI

# Every check below also runs locally, from the repository root:
#   bun scripts/ci/check-syntax.ts            extension scripts parse as classic scripts
#   bun scripts/ci/check-manifest-locales.ts  manifest.json, referenced files and locales
#   bun scripts/ci/check-versions.ts          version sync (manifest, package.json, server, docs, Bun)
#   cd mcp-server && bun run typecheck && bun run test:unit && bun run test:integration
#   cd mcp-server && bunx tsc -p ../scripts/ci/tsconfig.json
#   cd mcp-server && bun run docs:tools:check  docs/tools.md matches the server's tools/list
#   cd mcp-server && bun run build:binary && cd .. && bun scripts/ci/smoke-binary.ts

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Read-only token for every job, also for pull requests from forks.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Git Bash on Windows, so every step runs the same way on all three OSes.
    shell: bash

jobs:
  typecheck:
    name: Typecheck MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # uses: steps ignore defaults.run.working-directory, so the path is from the repo root.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: mcp-server/.bun-version
      # setup-bun silently installs the latest Bun when it cannot read the version file.
      - name: Check the Bun version
        working-directory: .
        run: bun scripts/ci/check-versions.ts --bun=pinned
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Bun runs scripts/ci/*.ts without checking types.
      - name: Typecheck CI scripts
        run: bunx tsc -p ../scripts/ci/tsconfig.json
      # The reference part of docs/tools.md is generated from the server's own tools/list
      # (mcp-server/scripts/gen-tools-doc.ts); fix a failure with `bun run docs:tools`.
      - name: Check docs/tools.md is up to date
        run: bun run docs:tools:check

  test:
    name: Test (${{ matrix.os }}, Bun ${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Bun pinned in mcp-server/.bun-version, on every OS the server supports.
          - os: ubuntu-latest
            bun: pinned
          - os: windows-latest
            bun: pinned
          - os: macos-latest
            bun: pinned
          # The oldest Bun that mcp-server/package.json engines.bun allows (runtime only, see
          # the steps); check-versions.ts fails when the two differ. The standalone-compile
          # test skips itself below 1.3.7.
          - os: ubuntu-latest
            bun: minimum
            bun-version: "1.3.3"
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The pinned Bun always installs the dependencies: Bun < 1.4 cannot read
      # bun.lock (lockfileVersion 2), so --frozen-lockfile fails there.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: mcp-server/.bun-version
          # The minimum job swaps this binary below; keep it out of the pinned version's cache entry.
          no-cache: ${{ matrix.bun == 'minimum' }}
      - run: bun install --frozen-lockfile
      # Minimum job: the tests then run on the oldest Bun engines.bun allows.
      - if: matrix.bun == 'minimum'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      # setup-bun silently installs the latest Bun when it cannot read a version,
      # which would turn this job into a "latest" job.
      - name: Check the Bun version
        working-directory: .
        run: bun scripts/ci/check-versions.ts --bun=${{ matrix.bun }}
      # Unit suites: src/*.test.ts and test/unit.
      - name: Unit tests
        run: bun run test:unit
      # test/integration drives the real extension scripts (happy-dom page harness),
      # which needs Bun >= 1.4; the extension itself runs in Chrome, not Bun, so the
      # minimum job skips it. Drop the condition once the harness runs on 1.3.x.
      - name: Integration tests
        if: matrix.bun == 'pinned' && (success() || failure())
        run: bun run test:integration

  binary:
    name: Standalone binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: mcp-server/.bun-version
      # The release executables embed this Bun: never let it fall back to the latest.
      - name: Check the Bun version
        run: bun scripts/ci/check-versions.ts --bun=pinned
      - run: bun install --frozen-lockfile
        working-directory: mcp-server
      - name: Build the binary for this OS
        run: bun run build:binary
        working-directory: mcp-server
      # MCP initialize and tools/list over stdio, exit code 0 on stdin EOF, and the
      # working directory's bunfig.toml (preload) and .env must not reach the server.
      - name: Smoke-test the binary
        run: bun scripts/ci/smoke-binary.ts

  extension:
    name: Validate extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: mcp-server/.bun-version
      - name: Check the Bun version
        run: bun scripts/ci/check-versions.ts --bun=pinned
      # Every .js under extension/ is compiled (never executed) as a classic script,
      # the way Chrome loads the service worker, content and popup scripts.
      - name: Syntax-check extension scripts
        run: bun scripts/ci/check-syntax.ts
      # manifest.json and every _locales/<locale>/messages.json must parse, files the
      # manifest and pages reference must exist, every locale must have exactly the
      # key set (and placeholders) of the default locale, and every message key the
      # manifest, pages, popup and permission categories use must exist.
      - name: Validate manifest.json and locales
        run: bun scripts/ci/check-manifest-locales.ts
      # Releases bump extension/manifest.json and mcp-server/package.json together;
      # the server reads its version from package.json (bridge.ts SERVER_VERSION).
      - name: Check version sync
        run: bun scripts/ci/check-versions.ts
