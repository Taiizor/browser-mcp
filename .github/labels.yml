# Label definitions, synced by .github/workflows/label-sync.yml (EndBug/label-sync).
# Keep names stable: issue templates and PRs reference them.

- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "type: enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "type: docs"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "type: question"
  color: "d876e3"
  description: "Further information is requested"
- name: "type: maintenance"
  color: "fbca04"
  description: "Refactor, tooling, CI, or dependency upkeep"
- name: "type: security"
  color: "b60205"
  description: "Security-related work (see SECURITY.md)"
- name: "area: extension"
  color: "0e8a16"
  description: "Chrome MV3 extension"
- name: "area: server"
  color: "0e8a16"
  description: "MCP server / WebSocket bridge"
- name: "area: ci"
  color: "5319e7"
  description: "CI, workflows, repo tooling"
- name: "status: good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "status: help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "status: duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "status: invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "status: wontfix"
  color: "ffffff"
  description: "This will not be worked on"
